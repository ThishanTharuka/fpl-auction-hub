name: Discord Notifications

on:
  push:
    branches:
      - master
      - develop
    tags:
      - v*
  release:
    types: [published]

permissions: {}

jobs:
  notify-push:
    name: Notify Push
    if: github.event_name == 'push' && github.ref_type == 'branch'
    runs-on: ubuntu-latest
    steps:
      - name: Send Push Notification
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          REF_NAME: ${{ github.ref_name }}
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          COMMIT_TIMESTAMP: ${{ github.event.head_commit.timestamp }}
        run: |
          PAYLOAD=$(jq -n \
            --arg ref "$REF_NAME" \
            --arg repo_url "$SERVER_URL/$REPOSITORY" \
            --arg actor "$ACTOR" \
            --arg commit_url "$SERVER_URL/$REPOSITORY/commit/$COMMIT_SHA" \
            --arg sha "$COMMIT_SHA" \
            --arg msg "$COMMIT_MSG" \
            --arg ts "$COMMIT_TIMESTAMP" \
            '{
              embeds: [
                {
                  title: ("🚀 Push to " + $ref),
                  color: 5814783,
                  url: $repo_url,
                  fields: [
                    { name: "Author", value: $actor },
                    { name: "Commit", value: ("[" + $sha + "](" + $commit_url + ")") },
                    { name: "Message", value: $msg }
                  ],
                  timestamp: $ts
                }
              ]
            }')

          curl -s -H "Content-Type: application/json" \
            -X POST \
            -d "$PAYLOAD" \
            "$DISCORD_WEBHOOK"

  notify-tag:
    name: Notify Release
    if: github.event_name == 'push' && github.ref_type == 'tag' || github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - name: Send Release Notification
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          REF_NAME: ${{ github.ref_name }}
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
        run: |
          TS=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          PAYLOAD=$(jq -n \
            --arg ref "$REF_NAME" \
            --arg repo "$REPOSITORY" \
            --arg repo_url "$SERVER_URL/$REPOSITORY/releases/tag/$REF_NAME" \
            --arg actor "$ACTOR" \
            --arg ts "$TS" \
            '{
              embeds: [
                {
                  title: ("🏷 Release " + $ref),
                  color: 15258703,
                  url: $repo_url,
                  fields: [
                    { name: "Repository", value: $repo },
                    { name: "Tag", value: $ref },
                    { name: "Published by", value: $actor }
                  ],
                  timestamp: $ts
                }
              ]
            }')

          curl -s -H "Content-Type: application/json" \
            -X POST \
            -d "$PAYLOAD" \
            "$DISCORD_WEBHOOK"
