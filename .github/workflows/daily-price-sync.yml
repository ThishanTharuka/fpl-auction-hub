name: FPL Daily Price Sync

on:
  schedule:
    # Hourly. FPL applies price changes at 00:00 UK time and a day bucket can
    # only be recorded while the job is running, so a single daily run silently
    # swallows every day it misses into the next successful run (which is how
    # the history ended up with gaps and 200+ mover days). Hourly also keeps the
    # run clear of GitHub's top-of-the-hour scheduling spike.
    - cron: '7 * * * *'
  workflow_dispatch:
    inputs:
      target_url:
        description: 'Target Application URL (e.g. https://fpl-auction-hub.vercel.app)'
        required: false
        default: ''

permissions: {}

jobs:
  sync-prices:
    name: Sync Daily Prices
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger Price Sync Endpoint
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          INPUT_URL: ${{ github.event.inputs.target_url }}
          APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL || 'https://fpl-auction-hub.vercel.app' }}
        run: |
          TARGET="${INPUT_URL:-$APP_URL}"
          echo "Triggering price sync on: ${TARGET}/api/fpl/daily-prices/sync"
          
          if [ -n "$CRON_SECRET" ]; then
            curl -f -sS -X POST "${TARGET}/api/fpl/daily-prices/sync" \
              -H "Authorization: Bearer ${CRON_SECRET}" \
              -H "Content-Type: application/json"
          else
            curl -f -sS -X POST "${TARGET}/api/fpl/daily-prices/sync" \
              -H "Content-Type: application/json"
          fi
          echo ""
          echo "Price sync completed successfully."