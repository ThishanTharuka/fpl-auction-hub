name: CI

on:
  push:
    branches:
      - master
      - develop
  pull_request:
    branches:
      - master
      - develop

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci --include=optional

      - run: npm run type-check

      - run: npm run lint

      - run: npm test

  release:
    name: Release
    needs: [verify]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci --include=optional

      - run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  notify:
    name: Notify Discord
    needs: [verify]
    if: always() && github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/develop')
    runs-on: ubuntu-latest
    steps:
      - name: Determine Status
        id: status
        run: |
          if [ "${{ needs.verify.result }}" = "success" ]; then
            echo "status=success" >> $GITHUB_OUTPUT
            echo "color=5814783" >> $GITHUB_OUTPUT
            echo "emoji=✅" >> $GITHUB_OUTPUT
          elif [ "${{ needs.verify.result }}" = "failure" ]; then
            echo "status=failure" >> $GITHUB_OUTPUT
            echo "color=15548997" >> $GITHUB_OUTPUT
            echo "emoji=❌" >> $GITHUB_OUTPUT
          else
            echo "status=cancelled" >> $GITHUB_OUTPUT
            echo "color=10070709" >> $GITHUB_OUTPUT
            echo "emoji=⚠️" >> $GITHUB_OUTPUT
          fi

      - name: Send Notification
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          STATUS: ${{ steps.status.outputs.status }}
          COLOR: ${{ steps.status.outputs.color }}
          EMOJI: ${{ steps.status.outputs.emoji }}
          REPOSITORY: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
          RUN_ID: ${{ github.run_id }}
          REF_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
          VERIFY_RESULT: ${{ needs.verify.result }}
          WORKFLOW_NAME: ${{ github.workflow }}
        run: |
          TS=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          PAYLOAD=$(jq -n \
            --arg title "$EMOJI CI $STATUS — $REPOSITORY" \
            --argjson color "$COLOR" \
            --arg run_url "$SERVER_URL/$REPOSITORY/actions/runs/$RUN_ID" \
            --arg branch "$REF_NAME" \
            --arg commit "[$COMMIT_SHA]($SERVER_URL/$REPOSITORY/commit/$COMMIT_SHA)" \
            --arg actor "$ACTOR" \
            --arg verify "$VERIFY_RESULT" \
            --arg workflow "$WORKFLOW_NAME" \
            --arg ts "$TS" \
            '{
              embeds: [
                {
                  title: $title,
                  color: $color,
                  url: $run_url,
                  fields: [
                    { name: "Branch", value: $branch },
                    { name: "Commit", value: $commit },
                    { name: "Author", value: $actor },
                    { name: "Verify", value: $verify, inline: true },
                    { name: "Workflow", value: $workflow }
                  ],
                  timestamp: $ts
                }
              ]
            }')

          curl -s --show-error --fail \
            -H "Content-Type: application/json" \
            -X POST \
            -d "$PAYLOAD" \
            "$DISCORD_WEBHOOK" || echo "::warning::Discord webhook returned non-200"
