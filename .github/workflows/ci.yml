name: CI

on:
  push:
    branches:
      - master
      - develop
  pull_request:
    branches:
      - master
      - develop

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci --include=optional

      - run: npm run type-check

      - run: npm run lint

      - run: npm test

  release:
    name: Release
    needs: [verify]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci --include=optional

      - run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  notify:
    name: Notify Discord
    needs: [verify, release]
    if: always() && github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/develop')
    runs-on: ubuntu-latest
    steps:
      - name: Determine Status
        id: status
        run: |
          if [ "${{ needs.verify.result }}" = "success" ] && [ "${{ needs.release.result }}" = "success" ]; then
            echo "status=success" >> $GITHUB_OUTPUT
            echo "color=5814783" >> $GITHUB_OUTPUT
            echo "emoji=✅" >> $GITHUB_OUTPUT
          elif [ "${{ needs.verify.result }}" = "failure" ] || [ "${{ needs.release.result }}" = "failure" ]; then
            echo "status=failure" >> $GITHUB_OUTPUT
            echo "color=15548997" >> $GITHUB_OUTPUT
            echo "emoji=❌" >> $GITHUB_OUTPUT
          else
            echo "status=cancelled" >> $GITHUB_OUTPUT
            echo "color=10070709" >> $GITHUB_OUTPUT
            echo "emoji=⚠️" >> $GITHUB_OUTPUT
          fi

      - name: Send Notification
        run: |
          curl -sf -H "Content-Type: application/json" \
          -X POST \
          -d '{
            "embeds":[
              {
                "title":"${{ steps.status.outputs.emoji }} CI ${{ steps.status.outputs.status }} — ${{ github.repository }}",
                "color":${{ steps.status.outputs.color }},
                "url":"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
                "fields":[
                  {
                    "name":"Branch",
                    "value":"${{ github.ref_name }}"
                  },
                  {
                    "name":"Commit",
                    "value":"[${{ github.sha }}](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})"
                  },
                  {
                    "name":"Author",
                    "value":"${{ github.actor }}"
                  },
                  {
                    "name":"Verify",
                    "value":"${{ needs.verify.result }}",
                    "inline":true
                  },
                  {
                    "name":"Release",
                    "value":"${{ needs.release.result }}",
                    "inline":true
                  },
                  {
                    "name":"Workflow",
                    "value":"${{ github.workflow }}"
                  }
                ],
                "timestamp":"$(date -u +%Y-%m-%dT%H:%M:%SZ)"
              }
            ]
          }' \
          ${{ secrets.DISCORD_WEBHOOK }}
